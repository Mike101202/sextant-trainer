name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - name: Set Up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install dependencies
      run: npm install
      
    - name: Add Android platform
      run: npx cap add android
      
    - name: Sync web assets
      run: npx cap sync android
      
    - name: Add GPS Permissions
      run: |
        MANAFEST="android/app/src/main/AndroidManifest.xml"
        sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />' $MANAFEST
      
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Sextant-Trainer-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
