<!DOCTYPE html>
<html>
<body style="padding: 20px; font-family: sans-serif;">
  <h2>SVG to Base64</h2>
  <p>1. Select your Marine_sextant.svg file below.</p>
  <p>2. The Base64 code will be copied to your clipboard automatically.</p>
  <input type="file" id="fileInput" accept=".svg, .png" style="margin-bottom: 20px;">
  <textarea id="output" rows="10" style="width: 100%; font-size: 12px;" readonly placeholder="Base64 string will appear here..."></textarea>
  
  <script>
    document.getElementById('fileInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const text = e.target.result;
        // Convert to base64 safely for SVG
        const base64 = btoa(unescape(encodeURIComponent(text)));
        document.getElementById('output').value = base64;
        
        // Copy to clipboard
        navigator.clipboard.writeText(base64).then(() => {
          alert("Success! Base64 code copied to clipboard.");
        }).catch(err => {
          alert("Copied to the text box. Please select and copy manually.");
        });
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
