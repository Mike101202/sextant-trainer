<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#12355b"/>

  <!-- The Sun -->
  <circle cx="90" cy="65" r="35" fill="#f4d35e"/>
  <line x1="90" y1="5" x2="90" y2="-10" stroke="#f4d35e" stroke-width="8" stroke-linecap="round"/>
  <line x1="90" y1="125" x2="90" y2="140" stroke="#f4d35e" stroke-width="8" stroke-linecap="round"/>
  <line x1="30" y1="65" x2="15" y2="65" stroke="#f4d35e" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="65" x2="165" y2="65" stroke="#f4d35e" stroke-width="8" stroke-linecap="round"/>
  <line x1="50" y1="25" x2="35" y2="10" stroke="#f4d35e" stroke-width="8" stroke-linecap="round"/>

  <!-- The Horizon (Raised to y=280) -->
  <line x1="0" y1="280" x2="264" y2="280" stroke="#7fb2e5" stroke-width="6" stroke-dasharray="12 12" stroke-linecap="round"/>

  <!-- Sextant Frame -->
  <g id="frame">
    <path d="M 256 125 L 116 367.5 A 280 280 0 0 0 396 367.5 Z" fill="#e8eef4"/>
    <path d="M 256 125 L 123.5 354.5 A 265 265 0 0 0 388.5 354.5 Z" fill="#12355b"/>
  </g>

  <!-- Index Arm -->
  <g id="index-arm">
    <line x1="256" y1="125" x2="256" y2="435" stroke="#e8eef4" stroke-width="16" stroke-linecap="round"/>
    <rect x="226" y="405" width="60" height="40" rx="6" fill="#e8eef4"/>
    <line x1="246" y1="405" x2="246" y2="445" stroke="#12355b" stroke-width="4"/>
    <line x1="266" y1="405" x2="266" y2="445" stroke="#12355b" stroke-width="4"/>
  </g>

  <!-- Arc Tick Marks -->
  <g id="ticks">
    <line x1="185" y1="380" x2="178" y2="393" stroke="#12355b" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="390" x2="256" y2="405" stroke="#12355b" stroke-width="4" stroke-linecap="round"/>
    <line x1="327" y1="380" x2="334" y2="393" stroke="#12355b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Optics -->
  <g id="optics">
    <!-- Telescope (Raised to y=262) -->
    <rect x="264" y="262" width="110" height="36" rx="8" fill="#e8eef4"/>
    <rect x="374" y="254" width="20" height="52" rx="4" fill="#7fb2e5"/>
    
    <!-- Index Mirror -->
    <circle cx="256" cy="125" r="32" fill="#e8eef4"/>
    <circle cx="256" cy="125" r="16" fill="#7fb2e5"/>

    <!-- Horizon Mirror (Raised along the arm) -->
    <g transform="translate(154.4, 301) rotate(60)">
      <rect x="-40" y="-14" width="40" height="14" rx="3" fill="#e8eef4"/>
      <line x1="-40" y1="-7" x2="0" y2="-7" stroke="#7fb2e5" stroke-width="6"/>
    </g>
  </g>

  <!-- The Optical Path (Hits new center at 150.5, 280) -->
  <g id="light-path">
    <path d="M 120 65 L 256 125 L 150.5 280 L 264 280" fill="none" stroke="#f4d35e" stroke-width="6" stroke-linejoin="round" stroke-dasharray="8 8"/>
  </g>
</svg>